<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MXDR L1 SOC Crash Course</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%236ea8ff' d='M8 1l6 2v4c0 4-2.5 7-6 8-3.5-1-6-4-6-8V3z'/></svg>">
<style>
  :root{
    --bg0:#0a0d14; --bg1:#0f1420; --bg2:#151b2a; --bg3:#1d2536; --bg4:#26304a;
    --border:#212a3d; --border2:#32405e;
    --text:#e2e9f5; --muted:#8b98b3; --faint:#5d6a86;
    --accent:#6ea8ff; --accent2:#9d7bff; --green:#3dd68c;
    --p0:#ff6b6b; --p1:#ffb020; --p3:#8b98b3;
    --hl:#0b0e16;
    --radius:14px; --radius-s:8px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg0); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.55; display:flex; min-height:100vh;
  }
  ::selection{background:rgba(110,168,255,.3);}
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit;}

  /* scrollbar */
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--bg4); border-radius:6px; border:2px solid var(--bg0);}
  ::-webkit-scrollbar-track{background:transparent;}
  #scrollbar{position:fixed; top:0; left:0; height:3px; width:0; z-index:200;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--green)); border-radius:0 2px 2px 0;}

  /* ── Sidebar ───────────────────────────── */
  #sidebar{
    width:304px; min-width:304px; background:var(--bg1); border-right:1px solid var(--border);
    height:100vh; position:sticky; top:0; overflow-y:auto; padding:18px 14px 22px;
    display:flex; flex-direction:column; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:2px 6px; cursor:pointer; border-radius:var(--radius-s);
    border:1px solid transparent; transition:border-color .12s, background .12s; margin:-2px -6px; padding:4px 6px;}
  .brand:hover{border-color:var(--border); background:var(--bg2);}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .brand .logo{width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center; color:#0a0d14; font-weight:800; font-size:16px;}
  .brand h1{font-size:15px; line-height:1.25; letter-spacing:-.01em;}
  .brand .sub{font-size:11px; color:var(--muted); margin-top:2px;}
  #mode-badge{display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:10.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:20px; width:fit-content;}
  #mode-badge.ok{color:var(--green); background:rgba(61,214,140,.1); border:1px solid rgba(61,214,140,.25);}
  #mode-badge.warn{color:var(--p1); background:rgba(255,176,32,.1); border:1px solid rgba(255,176,32,.3);}

  .search-wrap{position:relative;}
  #search{width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px 9px 32px; border-radius:var(--radius-s); font-size:13px; outline:none; transition:border-color .15s, box-shadow .15s;}
  #search:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(110,168,255,.15);}
  .search-wrap .icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint);}
  #search-empty{display:none; color:var(--muted); font-size:12.5px; padding:18px 6px; text-align:center;}

  #groups{display:flex; flex-direction:column; gap:12px; flex:1;}
  .grp{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-s); overflow:hidden;}
  .grp-title{display:flex; align-items:center; gap:8px; width:100%; background:none; border:none;
    color:var(--text); padding:9px 11px; font-size:12px; cursor:pointer; text-align:left; font-weight:700; letter-spacing:.04em;}
  .grp-title:hover{background:var(--bg3);}
  .grp .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .grp.p0 .dot{background:var(--p0); box-shadow:0 0 8px rgba(255,107,107,.5);}
  .grp.p1 .dot{background:var(--p1); box-shadow:0 0 8px rgba(255,176,32,.5);}
  .grp.p3 .dot{background:var(--p3);}
  .grp-name{flex:1; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);}
  .grp-num{font-size:11px; color:var(--muted); font-family:var(--mono);}
  .grp .chev{color:var(--faint); transform:rotate(90deg); transition:transform .18s;}
  .grp.collapsed .chev{transform:none;}
  .grp.collapsed .grp-body{display:none;}
  .grp-body{border-top:1px solid var(--border); padding:4px;}
  .mod{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none;
    color:var(--muted); padding:7px 9px; border-radius:7px; font-size:13px; cursor:pointer;
    border-left:3px solid transparent; transition:background .12s,color .12s;}
  .mod:hover{background:var(--bg3); color:var(--text);}
  .mod.active{background:var(--bg3); color:var(--text); border-left-color:var(--accent);}
  .mod .chk{width:15px; height:15px; border-radius:50%; border:1.5px solid var(--border2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--bg0); opacity:0; transition:.15s;}
  .mod.done .chk{opacity:1; background:var(--green); border-color:var(--green); color:#06130c;}
  .mod .num{width:25px; color:var(--faint); font-family:var(--mono); font-size:11px; flex-shrink:0;}
  .mod.done .t{color:var(--green);}
  .mod .t{flex:1; line-height:1.3;}

  .side-foot{border-top:1px solid var(--border); padding-top:14px; display:flex; flex-direction:column; gap:12px;}
  .side-foot h3{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:4px;}
  .side-foot .links a{display:block; font-size:13px; padding:3px 0; color:var(--muted);}
  .side-foot .links a:hover{color:var(--accent);}
  .btn.small{padding:7px 12px; font-size:12px;}

  /* ── Main ─────────────────────────────── */
  #main{flex:1; min-width:0; padding:30px 38px 60px;}
  .inner{max-width:920px; margin:0 auto;}

  .card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--bg4);
    color:var(--text); font-weight:600; font-size:13px; padding:9px 16px; border-radius:var(--radius-s);
    border:1px solid transparent; cursor:pointer; transition:filter .12s, background .12s, transform .05s; white-space:nowrap;}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0d14;}
  .btn.ghost{background:var(--bg3); border-color:var(--border);}
  .btn:disabled{opacity:.45; cursor:default; filter:none;}

  /* ── Dashboard ─────────────────────────── */
  .hero{display:flex; align-items:center; justify-content:space-between; gap:24px; padding:30px 32px; margin-bottom:20px;
    position:relative; overflow:hidden;}
  .hero::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(600px 200px at 85% -20%, rgba(110,168,255,.14), transparent 60%);}
  .hero-kicker{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); margin-bottom:8px;}
  .hero h1{font-size:30px; line-height:1.12; letter-spacing:-.02em; margin-bottom:10px;
    background:linear-gradient(90deg,#fff,var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{color:var(--muted); font-size:13.5px; max-width:420px;}
  .hero-ring{flex-shrink:0; position:relative; width:132px; height:132px;}
  .ring-bg{fill:none; stroke:var(--bg3); stroke-width:9;}
  .ring-fg{fill:none; stroke:url(#ringGrad); stroke-width:9; stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset .4s ease;}
  .ring-mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-pct{font-size:26px; font-weight:800; font-family:var(--mono);}
  .ring-sub{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px;}
  .stat{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-s); padding:14px 16px;}
  .stat .v{font-size:24px; font-weight:800; font-family:var(--mono); letter-spacing:-.02em;}
  .stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-top:2px;}
  .stat .v.green{color:var(--green);} .stat .v.p0{color:var(--p0);} .stat .v.p1{color:var(--p1);} .stat .v.p3{color:var(--p3);}

  .prio-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:22px;}
  .prio{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-s); padding:16px 18px;}
  .prio-head{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; text-transform:uppercase;
    letter-spacing:.1em; margin-bottom:2px;}
  .prio-head .dot{width:9px; height:9px; border-radius:50%;}
  .prio.p0 .dot{background:var(--p0);} .prio.p1 .dot{background:var(--p1);} .prio.p3 .dot{background:var(--p3);}
  .prio-head .dot{box-shadow:0 0 8px currentColor;}
  .prio.p0 .prio-head{color:var(--p0);} .prio.p1 .prio-head{color:var(--p1);} .prio.p3 .prio-head{color:var(--muted);}
  .prio-num{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--text);}
  .prio-name{font-size:15px; font-weight:700; margin-bottom:1px;}
  .prio-desc{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .track{height:7px; background:var(--bg3); border-radius:4px; overflow:hidden;}
  .track i{display:block; height:100%; width:0; border-radius:4px; transition:width .3s ease;}
  .prio.p0 .track i{background:var(--p0);} .prio.p1 .track i{background:var(--p1);} .prio.p3 .track i{background:var(--p3);}

  .cont-wrap{margin-bottom:22px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .cont-wrap .label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);}
  .sim-quick{font-size:12.5px; color:var(--muted);}

  .tiles h2{font-size:16px; margin-bottom:12px; letter-spacing:-.01em;}
  .tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:10px;}
  .tile{text-align:left; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:12px 14px; cursor:pointer; color:var(--text); transition:border-color .12s, transform .12s, background .12s;}
  .tile:hover{border-color:var(--accent); transform:translateY(-1px); background:var(--bg3);}
  .tile-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .tile-num{font-family:var(--mono); font-size:11px; color:var(--faint);}
  .tile-chk{color:var(--green); font-weight:800;}
  .tile-title{font-size:12.5px; line-height:1.35; margin-bottom:9px; min-height:2.7em;}
  .tile-bar{height:4px; background:var(--bg3); border-radius:3px; overflow:hidden;}
  .tile-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--green));}

  /* ── Module view ───────────────────────── */
  #module-view .card-head{padding:24px 26px 20px;}
  .home-btn{margin-bottom:12px; font-size:12.5px; padding:6px 12px;}
  .top-line{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px;}
  .num-chip{font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.06em; padding:4px 11px;
    border-radius:20px; background:rgba(110,168,255,.12); color:var(--accent); border:1px solid rgba(110,168,255,.3);}
  .badge{font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:.05em; text-transform:uppercase;}
  .badge.p0{background:rgba(255,107,107,.12); color:var(--p0); border:1px solid rgba(255,107,107,.3);}
  .badge.p1{background:rgba(255,176,32,.12); color:var(--p1); border:1px solid rgba(255,176,32,.3);}
  .badge.p3{background:rgba(139,152,179,.12); color:var(--p3); border:1px solid rgba(139,152,179,.3);}
  .badge.plain{background:var(--bg3); color:var(--muted); border:1px solid var(--border);}
  .badge.done{background:rgba(61,214,140,.12); color:var(--green); border:1px solid rgba(61,214,140,.3);}
  .card-head h2{font-size:22px; letter-spacing:-.015em; margin-bottom:8px;}
  .card-head .desc{color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:18px;}
  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .mod-progress{display:flex; align-items:center; gap:14px;}
  .mod-progress .track{flex:1;}
  .mod-progress .track i{background:linear-gradient(90deg,var(--accent),var(--green));}
  #sec-label{font-size:12px; color:var(--muted); font-family:var(--mono); white-space:nowrap;}

  .card-secs{padding:20px 26px 26px; border-top:1px solid var(--border);}
  .card-secs h3{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:12px;}
  #sections{list-style:none; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:4px 18px;}
  #sections li{display:flex; align-items:flex-start; gap:10px; padding:6px 8px; border-radius:7px;
    font-size:13.5px; cursor:pointer; transition:background .12s;}
  #sections li:hover{background:var(--bg3);}
  #sections .box{margin-top:2px; width:16px; height:16px; border:1.5px solid var(--border2); border-radius:5px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:10px; color:transparent; transition:.15s;}
  #sections li.done{color:var(--faint);}
  #sections li.done .box{border-color:var(--green); background:rgba(61,214,140,.15); color:var(--green);}
  #sections li.done .sec-t{text-decoration:line-through;}

  /* ── Markdown content ──────────────────── */
  #md-body{margin:20px 0 0; border-top:1px solid var(--border); padding-top:22px;}
  .md-wrap{display:flex; gap:28px; align-items:flex-start;}
  .md-main{flex:1; min-width:0;}
  .md-toc{flex:0 0 200px; position:sticky; top:24px; max-height:calc(100vh - 48px); overflow:auto;
    font-size:12.5px; border-left:1px solid var(--border); padding-left:14px;}
  .toc-title{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:8px;}
  .toc-links a{display:block; color:var(--muted); padding:3px 0; line-height:1.35; border-left:2px solid transparent; padding-left:8px; margin-left:-14px;}
  .toc-links a:hover{color:var(--accent);}
  .toc-links a.active{color:var(--accent); border-left-color:var(--accent);}
  .toc-links a.toc-l3{padding-left:20px;}

  #md-body .md-main h1,#md-body .md-main h2,#md-body .md-main h3,
  #md-body .md-main h4,#md-body .md-main h5,#md-body .md-main h6{color:var(--text); line-height:1.3; margin:24px 0 10px; scroll-margin-top:20px;}
  #md-body .md-main h1{font-size:25px; padding-bottom:10px; border-bottom:1px solid var(--border); margin-top:8px;}
  #md-body .md-main h2{font-size:20px; padding-bottom:7px; border-bottom:1px solid var(--border);}
  #md-body .md-main h3{font-size:17px;}
  #md-body .md-main h4{font-size:15px;}
  #md-body .md-main p{margin:10px 0;}
  #md-body .md-main ul,#md-body .md-main ol{margin:10px 0 10px 26px;}
  #md-body .md-main li{margin:4px 0;}
  #md-body .md-main li::marker{color:var(--faint);}
  #md-body .md-main li > p{margin:4px 0;}
  #md-body .md-main strong{color:#fff; font-weight:700;}
  #md-body .md-main a{color:var(--accent); text-decoration:underline; text-underline-offset:2px;}
  #md-body .md-main hr{border:none; border-top:1px solid var(--border); margin:20px 0;}
  #md-body .md-main blockquote{margin:14px 0; padding:10px 16px; border-left:3px solid var(--accent);
    background:var(--bg3); border-radius:0 8px 8px 0; color:var(--muted);}
  #md-body .md-main blockquote p{margin:4px 0;}
  #md-body .md-main code{font-family:var(--mono); font-size:12.5px; background:var(--bg3); border:1px solid var(--border);
    padding:1.5px 6px; border-radius:5px; color:var(--text);}
  #md-body .md-main table{border-collapse:collapse; width:100%; margin:14px 0; font-size:13px;}
  #md-body .md-main th,#md-body .md-main td{border:1px solid var(--border); padding:7px 11px; text-align:left; vertical-align:top;}
  #md-body .md-main th{background:var(--bg3); font-weight:650; color:var(--text);}
  #md-body .md-main tr:nth-child(even) td{background:rgba(255,255,255,.02);}
  .table-wrap{overflow-x:auto; margin:14px 0;}
  .table-wrap table{margin:0;}
  #md-body .md-main img{max-width:100%; border-radius:8px;}

  .code-block{margin:14px 0; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--hl);}
  .code-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg3); padding:6px 12px; border-bottom:1px solid var(--border);}
  .code-lang{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-family:var(--mono);}
  .copy-btn{background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:3px 8px; border-radius:5px;}
  .copy-btn:hover{color:var(--text); background:var(--bg4);}
  .copy-btn.ok{color:var(--green);}
  .code-block pre{margin:0; padding:13px 16px; overflow-x:auto; line-height:1.55; background:var(--hl);}
  .code-block.hl pre{max-height:440px; overflow:auto;}
  .code-block pre code{background:none; border:none; padding:0; font-family:var(--mono); font-size:12.5px; color:var(--text); display:block;}
  .hljs{background:transparent; color:var(--text); padding:0;}
  .hljs-keyword,.hljs-selector-tag,.hljs-tag{color:#ff7b9d;}
  .hljs-string,.hljs-regexp,.hljs-addition{color:#9fe88a;}
  .hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet{color:#ffab70;}
  .hljs-comment,.hljs-quote{color:#5d6a86; font-style:italic;}
  .hljs-title,.hljs-section,.hljs-name{color:#82c4ff;}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#d2a8ff;}
  .hljs-built_in,.hljs-type,.hljs-class{color:#7cd7ff;}
  .hljs-function,.hljs-meta,.hljs-title.function_{color:#82c4ff;}
  .hljs-operator,.hljs-punctuation{color:#8b98b3;}
  .hljs-emphasis{font-style:italic;} .hljs-strong{font-weight:700;}

  .nav-row{display:flex; justify-content:space-between; gap:10px; margin-top:34px; padding-top:18px; border-top:1px solid var(--border);}

  /* ── Guided (wizard) mode ────────────────── */
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; align-self:flex-start;}
  .seg button{background:var(--bg2); border:none; color:var(--muted); padding:8px 14px; font-size:12px; font-weight:650;
    cursor:pointer; letter-spacing:.02em; transition:background .12s,color .12s;}
  .seg button+.seg button{border-left:1px solid var(--border);}
  .seg button:hover{color:var(--text);}
  .seg button.on{background:var(--accent); color:#0b1020;}
  .wz-top{margin-bottom:18px; padding:16px 18px; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--bg2);}
  .wz-meta{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); font-family:var(--mono);}
  .wz-meta b{color:var(--accent);}
  .wz-track{height:6px; background:var(--bg3); border-radius:4px; overflow:hidden; margin:10px 0 0;}
  .wz-track i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--green)); border-radius:4px; transition:width .25s ease;}
  .wz-title{font-size:19px; letter-spacing:-.015em; color:var(--text); margin:0 0 6px; padding-bottom:8px; border-bottom:1px solid var(--border);}
  .wz-nav{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:28px; padding-top:16px; border-top:1px solid var(--border);}
  .wz-nav .spacer{flex:1;}

{q:"Who performs the initial alert triage in a typical SOC?",type:"mc",o:["Incident commander","Tier 3 threat hunter","Tier 1 (L1) analyst","SIEM administrator"],a:2,e:"Tier 1 / L1 analysts are the first line: they validate alerts, triage and escalate."},
{q:"A scanner fires against a honeypot deliberately deployed to attract attackers. The alert is best classified as:",type:"mc",o:["False positive","Benign positive","Unknown","True positive"],a:3,e:"The detection correctly fired on real (attack-like) activity, but the activity is expected/decoy — a true positive that is benign in context."},

{q:"What does XDR add beyond EDR?",type:"mc",o:["Native correlation across endpoint, network, cloud, email and identity telemetry","Automatic firewall rules","A second antivirus engine","More endpoint memory dumps"],a:0,e:"XDR (Extended Detection and Response) unifies multiple data domains, whereas EDR focuses on endpoint telemetry."},
{q:"MDR stands for:",type:"mc",o:["Managed Data Retention","Managed Detection and Response","Machine Detection and Response","Multi-layer Defense and Recovery"],a:1,e:"MDR = Managed Detection and Response — a service that runs and monitors EDR/security tooling for you."},
{q:"MXDR = Managed ___ (the platform it extends).",type:"input",a:["xdr","extended detection and response"],e:"MXDR = Managed Extended Detection and Response — a vendor platform plus a managed SOC team."},
{q:"Which is LEAST likely to be a native telemetry source for an XDR platform?",type:"mc",o:["Network flow and DNS data","Email gateway logs","Paper-based visitor logs","Endpoint process activity"],a:2,e:"XDR pulls from digital security sources (endpoints, network, email, cloud, identity) — physical visitor logs are not one."},
{q:"A customer already has EDR but wants a vendor team to monitor and investigate 24/7. They typically buy:",type:"mc",o:["A new firewall","A pentest","A SIEM license only","MDR (managed EDR)"],a:3,e:"MDR manages the detection/response workload on top of the customer's EDR — that is the standard MDR model."},
{q:"Which component distinguishes MXDR from a standalone SIEM?",type:"mc",o:["A managed SOC team plus an integrated XDR platform","Just a bigger log store","Only firewall rules","A helpdesk"],a:0,e:"MXDR bundles the platform WITH a 24/7 managed analyst team."},
{q:"In a typical MXDR offering, who owns detection rules and tuning?",type:"mc",o:["The browser","The vendor's detection engineering team","The customer's accounting department","Only the network team"],a:1,e:"Detection engineering and tuning are vendor-managed in the MXDR model."},
{q:"A customer keeps their own SIEM but outsources 24/7 monitoring of EDR alerts. This is:",type:"mc",o:["CSPM","A pen test","MDR (managed detection and response)","IaaS"],a:2,e:"MDR typically manages the customer's EDR and triages alerts around the clock."},
{q:"Which data source gives an XDR platform visibility into lateral movement?",type:"mc",o:["Only email quarantine","HR records","Physical access badges","Network flow plus endpoint process correlation"],a:3,e:"XDR correlates endpoint + network telemetry to see east-west movement."},
{q:"Which statement about XDR vs SIEM is most accurate?",type:"mc",o:["XDR focuses on integrated detection/response; SIEM focuses on log collection and correlation","SIEM is always better","XDR replaces the firewall","They are identical"],a:0,e:"SIEM centralizes logs; XDR delivers integrated detection and response across domains."}

{q:"Severity vs priority:",type:"mc",o:["They are the same thing","Severity = impact/urgency of the incident; priority = severity × asset criticality","Priority is always P1","Severity is only used in tickets"],a:1,e:"Priority combines severity with how critical the affected asset is (the priority matrix)."},
{q:"Which BEST fits a P1 (critical) incident?",type:"mc",o:["High disk usage on a server","A single user locked out","Active ransomware encryption or a confirmed data breach","A typo in a ticket"],a:2,e:"P1 = active breach: ransomware encrypting data, data exfiltration, domain admin compromise, etc."},
{q:"In a typical MXDR SLA, how many minutes to ACKNOWLEDGE a P1 alert?",type:"input",a:["15","15 minutes","15 min"],e:"Typical: acknowledge within 15 minutes, contain within 1 hour."},
{q:"You discover a domain admin account was compromised. You should:",type:"mc",o:["Mark it benign","Only note it in the ticket","Wait for the next shift","Escalate IMMEDIATELY"],a:3,e:"Privileged-account compromise / active breach is an immediate escalation criterion."},
{q:"An alert hits a customer's internet-facing web server vs an internal file server. The priority differs because of:",type:"mc",o:["Asset criticality","Log volume","The alert name","The time of day"],a:0,e:"The priority matrix multiplies severity by asset criticality — exposure and sensitivity change priority."},
{q:"Urgency in severity means:",type:"mc",o:["The alert count","How quickly the incident must be handled","How many users are affected","The cost of the asset"],a:1,e:"Urgency = time sensitivity; impact = degree of harm."},
{q:"Which is typically a P2 (high) incident?",type:"mc",o:["A disk-full warning","A single workstation ransomware","A user-account compromise without privilege","A minor email bounce"],a:2,e:"Non-privileged account compromise is usually P2; ransomware is usually P1."},
{q:"When escalating, you should provide:",type:"mc",o:["Only the ticket number","A guess","Nothing","Alert details, evidence, timeline and actions taken"],a:3,e:"A complete escalation packet lets L2/L3 act immediately."},
{q:"Which condition REQUIRES immediate escalation?",type:"mc",o:["Active exfiltration of customer data","A typo in a ticket","A printer error","A forgotten password"],a:0,e:"Confirmed data loss/theft is an immediate escalation trigger."},
{q:"The containment SLA target for a P1 is typically 1 ___ (unit of time).",type:"input",a:["hour","hours","hr","hrs","1 hour"],e:"Typical: acknowledge in 15 minutes, contain in 1 hour."}
],

4:[
{q:"Event ID for a SUCCESSFUL logon?",type:"input",a:["4624"],e:"4624 = successful logon. Correlate it with 4625, 4672 and logon type."},
{q:"Event ID for a FAILED logon?",type:"input",a:["4625"],e:"4625 = failed logon. Many from one source to one account = brute force pattern."},
{q:"Event ID 4688 records:",type:"mc",o:["A user password change","Process creation (a new process started)","A firewall rule","USB insertion"],a:1,e:"4688 = process creation — key for execution and lateral-movement detection."},
{q:"Event ID 4672 means:",type:"mc",o:["A service was installed","A DNS query was made","Special privileges were assigned to a new logon","The account was locked out"],a:2,e:"4672 accompanies privileged logons; look for it right after a 4624."},
{q:"Remote interactive (RDP) logons use Logon Type:",type:"mc",o:["2","3","7","10"],a:3,e:"2=interactive, 3=network, 7=unlock, 10=remote interactive (RDP)."},
{q:"Scheduled task creation is Event ID:",type:"mc",o:["4698","4769","7036","4104"],a:0,e:"4698 = scheduled task created — a common persistence/execution technique."},
{q:"Event ID for an account lockout?",type:"input",a:["4740"],e:"4740 = account locked out — correlate with 4625 brute force."},
{q:"Event ID 7045 records:",type:"mc",o:["A DNS query","A new service installed","A user logon","A process exit"],a:1,e:"7045 = service installed — a common persistence technique."},
{q:"Which logon type is used by a service/batch job with stored credentials?",type:"mc",o:["2 (interactive)","10 (RDP)","4 (batch)","3 (network)"],a:2,e:"Logon type 4 = batch/service; compare against scheduled-task and service activity."},
{q:"Which authentication event is key for detecting pass-the-hash style activity?",type:"mc",o:["Only HTTPS errors","Only 4688","Nothing","NTLM credential validation (4776) with network logons"],a:3,e:"NTLM authentication via logon type 3 from odd sources = PtH detection point."},
{q:"Event ID 4634 records:",type:"mc",o:["A user logon","A user logoff","A password change","A privilege use"],a:1,e:"4634 = Logoff (any reason) — pairs with 4624 to measure session duration. 4647 is the user-initiated variant of the same thing."},
{q:"Which Event ID is generated for a Kerberos TGT request (AS-REQ)?",type:"input",a:["4768"],e:"4768 = Kerberos TGT request (AS-REQ). Unusual encryption types or off-hours requests here can indicate AS-REP roasting or Golden Ticket abuse."},
{q:"Event ID 4771 with failure code 0x18 typically means:",type:"mc",o:["Account locked out","Kerberos pre-authentication failed (bad password)","TGT request succeeded","Service ticket requested"],a:1,e:"4771 = Kerberos pre-auth failed; 0x18 = bad password. Repeated 4771s from one source is Kerberos-flavored brute force."},
{q:"A new user account being created is logged as Event ID:",type:"input",a:["4720"],e:"4720 = User Account Created. Baseline your expected account-creation workflow so unexpected 4720s stand out."},
{q:"A user being added to the Domain Admins group generates Event ID:",type:"mc",o:["4732","4728","4738","4725"],a:1,e:"4728 = member added to a security-enabled GLOBAL group (e.g. Domain Admins) — a classic privilege-escalation indicator. 4732 is for LOCAL groups."},
{q:"The distinction between Event ID 1102 and 4719 is:",type:"mc",o:["They are identical","1102 = the Security log was cleared; 4719 = the audit policy itself was changed","1102 = account locked; 4719 = account created","1102 = service installed; 4719 = process created"],a:1,e:"1102 = the Security log was cleared (anti-forensics). 4719 = the audit policy configuration was changed, often to reduce what gets logged going forward."},
{q:"On a 4625 failed logon, SubStatus 0xC000006A means:",type:"mc",o:["Account disabled","User does not exist","Wrong password","Account locked out"],a:2,e:"0xC000006A = STATUS_WRONG_PASSWORD, the most common brute-force/spray failure code. 0xC0000064 = no such user; 0xC0000234 = locked out."},
{q:"Full PowerShell script block content (including de-obfuscated/decoded script) is captured by Event ID:",type:"input",a:["4104"],e:"4104 = Script Block Logging, which records the full de-obfuscated script content — critical for catching encoded PowerShell attacks. 4103 only logs which modules/cmdlets were used."},
{q:"A user accessing a network share (e.g. an admin share like C$) is logged as Event ID:",type:"input",a:["5140"],e:"5140 = Network share object was accessed — key for spotting lateral movement over SMB/admin shares."},
{q:"Event IDs 6005 and 6006 together are most useful for spotting:",type:"mc",o:["Kerberoasting","A gap in logging caused by a service restart or log tampering","Privilege escalation","Process injection"],a:1,e:"6005 = Event Log service started, 6006 = stopped. An unexpected stop/start pair (without a full reboot) can indicate an attempt to tamper with or gap the logs."}
],

{q:"Sysmon Event ID 3 =",type:"mc",o:["Process creation","Network connection","Image loaded","DNS query"],a:1,e:"EID 3 = NetworkConnection — the connection the process made."},

{q:"An attacker runs \"powershell -version 2\" to:",type:"mc",o:["Connect to Azure","Improve performance","Bypass script block logging (v2 has no 4104)","Run on Linux"],a:2,e:"Downgrade to PS v2 avoids 4104 script block logging entirely."},
{q:"Event ID 4103 records:",type:"mc",o:["PowerShell startup","Cmdlet exit codes","Script block logging","Module logging (cmdlet invocation)"],a:3,e:"4103 = module logging; 4104 = script block logging. Both belong to the 'visibility triad'."},
{q:"Constrained Language Mode (CLM):",type:"mc",o:["Restricts scripts to allowed APIs, blocking .NET abuse","Speeds up scripts","Disables all logging","Only works on Linux"],a:0,e:"CLM limits what PowerShell code can do, disrupting many attack patterns."},
{q:"Why is PowerShell so heavily abused?",type:"mc",o:["It is Linux-only","It is built into Windows, powerful, and can run from memory (fileless)","It is unencrypted","It only runs in the cloud"],a:1,e:"Present by default, scriptable, and executable in-memory — a perfect blend for attackers."},
{q:"Which PowerShell logging must be ENABLED via GPO to capture script blocks?",type:"mc",o:["Nothing is ever logged","Audit policy is off","Script Block Logging (4104)","Module logging only"],a:2,e:"4104 is off by default on older Windows — enable it via GPO."},

{q:"AMSI bypass attempts matter because they:",type:"mc",o:["Block the internet","Try to avoid in-memory inspection by AV/EDR","Speed up execution","Encrypt disks"],a:1,e:"Bypasses target AMSI so malicious scripts evade in-memory scanning."}
],

8:[

18:[
{q:"In MITRE ATT&CK, a \"tactic\" answers:",type:"mc",o:["How the attacker did it","WHY / the strategic goal of the step","Which tool was used","The victim's OS"],a:1,e:"Tactic = the objective (why). Technique = how it's done."},
{q:"A \"technique\" answers:",type:"mc",o:["The SIEM name","Why the attacker did it","HOW the step was performed","The password hash"],a:2,e:"Technique = the method; a procedure is the specific tool/code implementation."},
{q:"ATT&CK technique T1078 refers to:",type:"mc",o:["Drive-by compromise","SQL injection","Phishing","Valid Accounts"],a:3,e:"T1078 = valid accounts — using legitimate credentials to bypass controls."},
{q:"In the enterprise attack chain, the FIRST tactic is:",type:"mc",o:["Reconnaissance","Impact","Persistence","Exfiltration"],a:0,e:"The chain opens with Reconnaissance (TA0043), then Resource Development and Initial Access."},
{q:"ATT&CK Navigator is used to:",type:"mc",o:["Parse YARA rules","Visualize techniques and detection coverage on the matrix","Write email rules","Block IPs"],a:1,e:"Navigator lets you annotate the matrix — mapping detections and gaps."},

{q:"Which tactic follows Initial Access in the attack chain?",type:"mc",o:["Exfiltration","Impact","Reconnaissance","Execution"],a:3,e:"Order: Recon → Resource Dev → Initial Access → Execution → Persistence..."},
{q:"ATT&CK technique T1059 refers to:",type:"mc",o:["Command and Scripting Interpreter","Phishing","Valid accounts","Exfiltration"],a:0,e:"T1059 = command/scripting (PowerShell, cmd, bash, etc.)."},
{q:"Mapping detections to ATT&CK is useful because it:",type:"mc",o:["Speeds up the network","Shows coverage and gaps across the kill chain","Increases log volume","Replaces the SIEM"],a:1,e:"Coverage mapping highlights blind spots (gap analysis)."},

],

19:[
{q:"A brute force attack typically shows up as:",type:"mc",o:["A single failed logon","DNS errors","A port scan from the internet","Many failed logons (4625) for one account from one source, sometimes followed by a success (4624)"],a:3,e:"Many 4625 → one 4624 from the same source = brute force that succeeded."},
{q:"Password spraying differs from brute force by:",type:"mc",o:["Using one common password against many accounts (low-and-slow)","Trying every password on one account","Always succeeding","Using no passwords"],a:0,e:"Spraying is slow and distributed to avoid lockouts and detection."},
{q:"Kerberoasting detection centers on:",type:"mc",o:["Email logs","Event 4769 service-ticket requests with RC4/old encryption for SPN accounts","Event 4624","Web logs"],a:1,e:"Watch 4769 with RC4 (etype 0x17) from odd users for many SPNs."},
{q:"Impossible travel is when:",type:"mc",o:["An account is locked","DNS fails","A user logs in from two locations too far apart in too short a time","A user changes their password"],a:2,e:"Two logins that no aircraft could connect in the time window = impossible travel."},
{q:"Ransomware triage typically starts from:",type:"mc",o:["A DNS lookup","A printer job","An email bounce","Many file writes/renames + an EDR ransomware alert + encryption extensions"],a:3,e:"Look for EDR ransomware alerts correlated with mass file-extension changes."},
{q:"MFA bypass indicators often involve:",type:"mc",o:["Push-notification fatigue and repeated 4624 + 4771 anomalies","Longer passwords","Higher CPU usage","New certificates only"],a:0,e:"MFA fatigue = attackers spamming pushes until the user approves."},
{q:"Credential stuffing differs from password spraying by:",type:"mc",o:["Using no users","Reusing known breached username/password pairs","Using one password on many accounts","Never succeeding"],a:1,e:"Stuffing = breached credential lists; spraying = common passwords across users."},
{q:"Web application attacks (SQLi/XSS) are best seen in:",type:"mc",o:["Only DHCP","Memory dumps","WAF and web server logs","Only DNS"],a:2,e:"Web-tier logs capture injection and scanner patterns."},
{q:"LOLBin abuse detection relies on:",type:"mc",o:["Only email logs","Physical access","Only firewall rules","Process command lines (4688/Sysmon 1) matching known tools"],a:3,e:"Command-line telemetry catches living-off-the-land."},
{q:"Golden/silver ticket detection focuses on:",type:"mc",o:["4768/4769 anomalies, unusual encryption types and long ticket lifetimes","4625 failed logons","4688 processes","7045 services"],a:0,e:"Forged tickets show unusual encryption, long lifetimes and anomalous requests."}
],

20:[
{q:"SQL injection works because:",type:"mc",o:["Cookies are encrypted","The server trusts user input and concatenates it into SQL queries","The database is offline","The WAF is disabled"],a:1,e:"Unsanitized input reaching a query = injection. WAF and parameterized queries mitigate."},
{q:"Stored XSS means:",type:"mc",o:["SQL is injected","TLS fails","An attacker's script is stored on the server and executes in other users' browsers","The server crashes"],a:2,e:"Stored/persistent XSS executes for every visitor — high-impact."},
{q:"IDOR/BOLA is a failure of:",type:"mc",o:["Encryption","Rate limiting","Caching","Access control — changing an ID parameter to access another user's data"],a:3,e:"Object-level authorization lets users touch objects they shouldn't by tampering with IDs."},
{q:"SSRF lets an attacker:",type:"mc",o:["Make the server issue requests to internal resources","Steal the TLS certificate","Infect the browser","Read email headers"],a:0,e:"SSRF turns the server into a proxy to reach internal services."},
{q:"The primary web defense/visibility layer for L1 on web attacks is:",type:"mc",o:["DNS logs","WAF logs","The DHCP server","Only the database"],a:1,e:"WAF blocks and logs injection/XSS/scanner traffic; pair it with web/app server logs."},
{q:"Which is an example of Broken Access Control?",type:"mc",o:["A CSS typo","A TLS error","Accessing another user's order by changing an ID in the URL","A slow database"],a:2,e:"Horizontal/vertical privilege abuse = broken access control (IDOR)."},
{q:"Reflected XSS differs from stored XSS by:",type:"mc",o:["Being persistent","Only working offline","Using DNS","Not being persisted — the payload echoes back in the same response"],a:3,e:"Reflected = one-time echo; stored = saved on the server."},
{q:"Security headers like CSP, HSTS and X-Frame-Options:",type:"mc",o:["Harden the app against XSS/clickjacking/downgrade","Encrypt disks","Block all users","Replace the WAF"],a:0,e:"Headers are cheap, effective hardening controls."},
{q:"RCE in a web app often shows up as:",type:"mc",o:["Nothing","Child processes (cmd/powershell) spawned by the web server","Only DNS lookups","No logs"],a:1,e:"Look for command shells under w3wp/apache/nginx."},
{q:"A webshell dropped on a server is often detected by:",type:"mc",o:["Only DHCP","Memory dumps","Suspicious .aspx/.php/.jsp files in web roots plus WAF/web logs","Only email logs"],a:2,e:"Webshell = script file in the web root + HTTP requests to it."}
],

21:[
{q:"The UID of the root user?",type:"input",a:["0","root"],e:"UID 0 = root; 1–999 = system accounts; 1000+ = regular users."},

{q:"A SUID-bit binary owned by root is dangerous because:",type:"mc",o:["It cannot execute","It only reads","It runs as root regardless of who invokes it — a privilege-escalation vector","It runs as nobody"],a:2,e:"An attacker can execute root-owned SUID binaries to elevate privileges."},
{q:"auditd provides:",type:"mc",o:["Web server hosting","Firewall NAT rules","DHCP services","Kernel-level auditing (file access, syscalls, exec)"],a:3,e:"auditd records system calls and file access — Linux's Sysmon-like telemetry."},
{q:"Which file maps usernames to UIDs and home dirs (world-readable)?",type:"mc",o:["/etc/passwd","/etc/shadow","/etc/hosts","/var/log/auth.log"],a:0,e:"/etc/passwd is world-readable metadata; hashes live in /etc/shadow."},
{q:"A process running with EUID 0 is:",type:"mc",o:["Ignored","Running with root privileges","Blocked","A normal user process"],a:1,e:"EUID 0 = root-level execution — flag odd root processes."},
{q:"Which is a standard Linux persistence location?",type:"mc",o:["The MBR only","The recycle bin","/etc/rc.local and systemd units","C:\\Windows\\run32"],a:2,e:"Init/rc/systemd units, crontabs, .bashrc and authorized_keys are common."},
{q:"To see which users logged in via SSH, check:",type:"mc",o:["/etc/passwd","/var/log/dmesg","/proc/cpuinfo","/var/log/auth.log and last/lastlog"],a:3,e:"auth.log + last/lastlog show SSH and login history."}
],

22:[
{q:"SOAR = Security Orchestration, ___ and Response (middle word).",type:"input",a:["automation"],e:"SOAR = Security Orchestration, Automation and Response, plus case management."},
{q:"A SOAR playbook is:",type:"mc",o:["A predefined, automated workflow of steps for a given alert type","A firewall rule","A training video","A SIEM query"],a:0,e:"Playbooks encode investigation/response steps so they run consistently."},
{q:"Automation is SAFEST for:",type:"mc",o:["Isolating any host on a whim","Well-defined, deterministic, low-risk tasks (hash enrichment, blocklist updates)","Shutting down production databases","Deleting user accounts"],a:1,e:"Save high-risk actions (isolation, block, delete) for human approval."},
{q:"A key problem SOAR solves is:",type:"mc",o:["Bigger disks","More email","Alert fatigue and slow MTTR","Faster page loads"],a:2,e:"Automation filters noise and speeds up repetitive L1 tasks."},
{q:"Case management in SOAR is for:",type:"mc",o:["Billing","DNS records","Asset backups","Tracking investigations from alert to closure with a shared timeline"],a:3,e:"Shared case timelines keep investigations coherent across shifts."},
{q:"Which task is a good SOAR automation candidate?",type:"mc",o:["Reputation lookups (hash/IP) and enrichment","Deleting production databases","Bypassing approvals","Ignoring alerts"],a:0,e:"Enrichment is deterministic and safe to automate."},
{q:"Orchestration in SOAR refers to:",type:"mc",o:["Scheduling vacations","Integrating APIs/tools so workflows can act across them","Hiring more staff","Buying hardware"],a:1,e:"Orchestration = tool/API integration; automation = scripted actions."},
{q:"A key SOAR metric is:",type:"mc",o:["Number of meetings","Coffee consumed","Mean time to respond (MTTR)","Lines of code"],a:2,e:"MTTR and alert reduction show SOAR impact."},
{q:"Which action should a playbook NEVER take without approval?",type:"mc",o:["Look up a hash","Fetch a whois record","Append a note","Isolate a production host or block critical traffic"],a:3,e:"High-impact actions stay human-gated."},
{q:"When a playbook can't classify an alert, the correct outcome is:",type:"mc",o:["Escalate to a human","Delete it","Auto-close it","Mark it complete"],a:0,e:"Automation hands ambiguous cases off to analysts."}
],

24:[

],

25:[

async function fetchFile(m){
  const b=base(m.file);
  if(fileSrc[m.file]!=null) return fileSrc[m.file];
  if(b!==m.file&&fileSrc[b]!=null) return fileSrc[b];
  try{
    const c=localStorage.getItem(localKey(m.file))||(b!==m.file?localStorage.getItem(localKey(b)):null);
    if(c!=null) return c;
  }catch(e){}
  if(location.protocol==="file:") return null;
  try{
    const r=await fetch(m.file);
    if(!r.ok) return null;
    const t=await r.text();
    fileSrc[m.file]=t;
    return t;
  }catch(e){ return null; }
}

function slugify(s){
  let id=s.toLowerCase().replace(/[^\w\s-]/g,"").replace(/[\s_]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"")||"section";
  if(slugify.used[id]) id=id+"-"+(++slugify.used[id]); else slugify.used[id]=1;
  return id;
}

function renderMd(m,text){
  slugify.used={};
  let html;
  try{ html=marked.parse(text); }catch(e){ return {html:"<p class=\"md-err\">Failed to parse markdown.</p>",toc:[]}; }
  html=DOMPurify.sanitize(html);
  const w=document.createElement("div");
  w.innerHTML=html;
  w.querySelectorAll("pre code").forEach(el=>{
    try{ hljs.highlightElement(el); }catch(e){}
  });
  w.querySelectorAll("a[href]").forEach(a=>{ if(/^https?:/i.test(a.getAttribute("href")||"")){ a.target="_blank"; a.rel="noopener"; } });
  w.querySelectorAll("table").forEach(t=>{ const box=document.createElement("div"); box.className="table-wrap"; t.replaceWith(box); box.appendChild(t); });
  w.querySelectorAll("img").forEach(im=>im.loading="lazy");
  const toc=[];
  let firstH1=true;
  w.querySelectorAll("h1,h2,h3").forEach(h=>{
    if(h.tagName==="H1"&&firstH1){ firstH1=false; h.id=slugify(h.textContent); return; }
    h.id=slugify(h.textContent);
    toc.push({level:+h.tagName[1],text:h.textContent,id:h.id});
  });
  const sections=splitSections(w,m.s);
  return {html:w.innerHTML,toc,sections};
}
function splitSections(w,expected){
  const raw=[]; let cur=null; const intro=[];
  Array.from(w.childNodes).forEach(n=>{
    if(n.nodeType===1&&n.tagName==="H2"){
      if(cur) raw.push(cur);
      cur={title:n.textContent.trim(),html:"",node:n};
      return;
    }
    const s=n.outerHTML!=null?n.outerHTML:(n.textContent||"");
    if(!cur) intro.push(s); else cur.html+=s;
  });
  if(cur) raw.push(cur);
  const introHtml=intro.join("");
  if(raw.length&&introHtml) raw[0].html=introHtml+raw[0].html;
  // Wizard steps are meant to line up 1:1 with the module's declared section
  // list (m.s). Heading wording can drift slightly from that list without
  // being a real problem — but if MORE <h2> steps appear than declared (e.g.
  // a heading-like line escaped a fenced code block, such as an example
  // runbook template), the extra step would desync the sidebar checklist
  // from the wizard. Only then: fold any heading not in the declared list
  // into the previous real step instead of leaving a phantom step.
  if(expected&&raw.length>expected.length){
    const wanted=new Set(expected);
    const merged=[];
    raw.forEach(sec=>{
      if(wanted.has(sec.title)||!merged.length) merged.push({title:sec.title,html:sec.html});
      else merged[merged.length-1].html+=sec.node.outerHTML+sec.html;
    });
    return merged;
  }
  return raw.map(({title,html})=>({title,html}));
}

function wzGo(m,delta){
  const md=mdCache[m.file];
  if(!md||!md.sections||!md.sections.length) return;
  const secs=md.sections;
  const old=WIZ.step;
  const last=secs.length-1;
  if(delta>0&&old===last){
    markSecDone(m,secs[old].title);
    const q=document.querySelector(".quiz-card");
    if(q) q.scrollIntoView({behavior:"smooth",block:"start"});
    toast("Module "+fmt(m.n)+" content complete — try the quiz below");
    return;
  }
  const nw=Math.min(Math.max(0,old+delta),last);
  if(delta>0&&nw>old) markSecDone(m,secs[old].title);
  WIZ.step=nw;
  prog["m"+m.n+"_wz"]=nw; store.set(prog);
  const box=$("#md-body");
  if(!box) return;
  insertWizard(box,md,m);
  box.scrollIntoView({behavior:"smooth",block:"start"});
}
const normT=s=>String(s).toLowerCase().replace(/[^a-z0-9. ]/g,"").replace(/\.\s+/g,". ").replace(/\s+/g," ").trim();
function mkKey(s){
  const raw=String(s).replace(/ ?[—–-] .*$/,"").trim();
  const exact=normT(raw);
  const noParen=normT(raw.replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim());
  return {pre:exact.match(/^(\d+(?:\.\d+)*)/)?.[1]||null, exact, noParen};
}
function matchSection(m,title){
  const t=mkKey(title);
  for(let i=0;i<m.s.length;i++){
    const si=mkKey(m.s[i]);
    if(t.pre&&si.exact.startsWith(t.pre)) return i;
    if(si.exact===t.exact) return i;
    if(t.noParen&&t.noParen===si.noParen&&t.noParen.length>3) return i;
  }
  return -1;
}
function markSecDone(m,title){
  const idx=matchSection(m,title);
  if(idx<0) return;
  const arr=secArr(m);
  if(arr.includes(m.s[idx])) return;
  arr.push(m.s[idx]);
  prog["m"+m.n+"_s"]=arr; store.set(prog);
  const li=$("#sections li[data-i=\""+idx+"\"]");
  if(li) li.classList.add("done");
  updateSecUI(m);
  renderAll();
}

function addCopyButtons(box){
  box.querySelectorAll("pre").forEach(pre=>{

function observeToc(box,toc){
  const links=box.querySelectorAll(".toc-links a");
  if(!links.length||typeof IntersectionObserver==="undefined") return;
  const headings=box.querySelectorAll(".md-main h2,.md-main h3");
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+en.target.id));
      }
    });
  },{rootMargin:"-12% 0px -72% 0px"});
  headings.forEach(h=>obs.observe(h));
}

function onPicked(e){
  const files=[...e.target.files].filter(f=>/\.md$/i.test(f.name));
  if(!files.length){ toast("No .md files found in that folder"); return; }
  let done=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      const path=(f.webkitRelativePath||f.name).replace(/^\.\//,"");
      fileSrc[path]=r.result; fileSrc[f.name]=r.result;
      try{ localStorage.setItem(localKey(path),r.result); }catch(err){}
      if(++done===files.length){
        toast("Loaded "+files.length+" markdown files — all modules ready");
        if(CUR>=0) renderMdContent(MODULES[CUR],true);

  if(!force&&mdCache[m.file]){ box.style.display="block"; box.dataset.open="1"; if(wizardOn()) insertWizard(box,mdCache[m.file],m); else insertMd(box,mdCache[m.file],m); if(btn)btn.textContent="Hide content"; return; }
  if(mdLoading[m.file]&&!force) return;
  mdLoading[m.file]=true;
  box.style.display="block"; box.dataset.open="1";
  box.innerHTML='<div class="md-loading"><div class="spinner"></div><span>Loading <code>'+esc(m.file)+'</code>…</span></div>';
  if(btn)btn.textContent="Loading…";
  const text=await fetchFile(m);
  mdLoading[m.file]=false;
  if(CUR!==m.n) return;
  if(text==null){ box.innerHTML=fallbackPanel(m); if(btn)btn.textContent="Read content"; bindFallback(m); return; }
  const md=renderMd(m,text);
  mdCache[m.file]=md;
  box.style.display="block"; box.dataset.open="1";
  if(wizardOn()) insertWizard(box,md,m); else insertMd(box,md,m);
  if(btn)btn.textContent="Hide content";
}
function toggleRead(m){
  const box=$("#md-body"), btn=$("#read-btn");
  if(!box) return;
  if(box.dataset.open==="1"){
    box.style.display="none"; box.dataset.open="0";
    if(btn)btn.textContent=wizardOn()?"Start guided":"Read content";
  }else{
    box.style.display="block"; box.dataset.open="1";
    if(btn)btn.textContent="Hide content";
    if(!mdCache[m.file]&&!mdLoading[m.file]) renderMdContent(m,false);
    else if(mdCache[m.file]){ if(wizardOn()) insertWizard(box,mdCache[m.file],m); else insertMd(box,mdCache[m.file],m); }
  }
}
function prefetch(m){
  if(location.protocol==="file:") return;
  [m.n-1,m.n+1].forEach(i=>{
    if(i<0||i>=MODULES.length) return;
    const mm=MODULES[i];
    if(mdCache[mm.file]) return;
    fetchFile(mm).then(t=>{ if(t&&!mdCache[mm.file]) mdCache[mm.file]=renderMd(mm,t); });
  });
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }
    catch(e2){ return false; }
  }
}

const QUIZKEY="mxdr-l1-quiz";
const quizStore={ get(){try{return JSON.parse(localStorage.getItem(QUIZKEY))||{};}catch(e){return{};}}, set(o){try{localStorage.setItem(QUIZKEY,JSON.stringify(o));}catch(e){}} };
const qState=n=>quizStore.get()["m"+n]||{best:null,taken:0};
function qSave(n,o){ const s=quizStore.get(); s["m"+n]=o; quizStore.set(s); }
function quizBest(n){ return qState(n).best; }
const normAns=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[.,!?;:]+$/,"");

function renderQuiz(m){
  const qq=QUIZZES[m.n];
  const box=$("#quiz-body"); if(!box) return;
  if(!qq||!qq.length){ box.innerHTML='<p class="quiz-msg">No quiz for this module yet.</p>'; return; }
  const best=quizBest(m.n);
  box.innerHTML='<div class="quiz-qlist">'+
    qq.map((q,i)=>'<div class="quiz-q" id="q'+m.n+'_'+i+'">'+
      '<div class="q-text"><b>Q'+(i+1)+'.</b>'+esc(q.q)+'</div>'+
      (q.type==="mc"
        ? '<div class="quiz-opts">'+q.o.map((opt,j)=>'<label class="quiz-opt"><input type="radio" name="qz'+m.n+'_'+i+'" value="'+j+'"><span>'+esc(opt)+'</span></label>').join("")+'</div>'
        : '<input class="quiz-input" type="text" placeholder="Type your answer…">')+
      '<div class="quiz-exp" id="exp'+m.n+'_'+i+'"></div></div>').join("")+
    '</div>'+
    '<div class="quiz-actions">'+
      '<button class="btn primary" id="quiz-check">Check answers</button>'+
      '<button class="btn ghost" id="quiz-reset">Reset</button>'+
      '<span class="quiz-score" id="quiz-score"></span>'+
    '</div>';
  const bb=$("#quiz-best"); if(bb) bb.textContent=best!=null?("Best: "+best+"%"):"Not attempted";
  const sc=$("#quiz-score"); if(sc) sc.textContent=(qState(m.n).taken||0)+" attempt(s)";
  $("#quiz-check").onclick=()=>checkQuiz(m);
  $("#quiz-reset").onclick=()=>resetQuiz(m);
}

function checkQuiz(m){
  const qq=QUIZZES[m.n]; if(!qq||!qq.length) return;
  let score=0;
  qq.forEach((q,i)=>{
    const qbox=$("#q"+m.n+"_"+i); if(!qbox) return;
    if(q.type==="mc"){
      const sel=qbox.querySelector('input[type="radio"]:checked');
      const val=sel?+sel.value:-1;
      const ok=val===q.a;
      if(ok) score++;
      qbox.querySelectorAll(".quiz-opt").forEach((o,j)=>{
        o.classList.toggle("correct",j===q.a);
        o.classList.toggle("wrong",j===val&&j!==q.a);
      });
    }else{
      const inp=qbox.querySelector(".quiz-input");
      const val=normAns(inp?inp.value:"");
      const ok=(q.a||[]).some(acc=>normAns(acc)===val);
      if(ok){
        score++;
        inp.style.borderColor="var(--green)"; inp.style.color="var(--green)";
      }else{
        inp.style.borderColor="var(--p0)"; inp.style.color="var(--p0)";
      }
      const ans=document.createElement("div");
      ans.className="q-ans-in"; ans.textContent="Answer: "+(q.a||[]).join(" / ");
      inp.insertAdjacentElement("afterend",ans);
    }
    const ex=$("#exp"+m.n+"_"+i); if(ex){ ex.textContent=q.e||""; ex.classList.add("show"); }
  });
  const pct=Math.round(score/qq.length*100);
  const st=qState(m.n);
  if(st.best==null||pct>st.best) st.best=pct;
  st.taken=(st.taken||0)+1; qSave(m.n,st);
  const sc=$("#quiz-score"); if(sc) sc.innerHTML="Score: <b>"+pct+"%</b> ("+score+"/"+qq.length+") · Best: <b>"+st.best+"%</b>";
  const bb=$("#quiz-best"); if(bb) bb.textContent="Best: "+st.best+"%";
  renderAll();
  toast("Quiz: "+pct+"% — best saved");
}

function resetQuiz(m){
  const qq=QUIZZES[m.n]; if(!qq||!qq.length) return;
  renderQuiz(m);
  toast("Quiz reset — answer again");
}

  $$("#groups .grp").forEach(g=>{ g.style.display=[...g.querySelectorAll(".mod")].some(b=>b.style.display!=="none")?"":"none"; });

function keybindings(){
  document.addEventListener("keydown",e=>{
    const typing=/^(input|textarea|select)$/i.test(e.target.tagName);
    if(e.key==="/"&&!typing){ e.preventDefault(); $("#search").focus(); return; }
    if(e.key==="Escape"){ const s=$("#search"); if(s.value){ s.value=""; filter(""); } s.blur(); return; }
    if(typing) return;
    if(e.key==="d"){ showDashboard(); return; }
    if(e.key==="r"){ if(CUR>=0) toggleRead(MODULES[CUR]); return; }
    if(e.key==="["){ if(CUR>0) showModule(CUR-1); return; }
    if(e.key==="]"){ if(CUR<MODULES.length-1) showModule(CUR+1); return; }
    if(CUR>=0&&wizardOn()&&$("#md-body")&&$("#md-body").dataset.open==="1"){
      if(e.key==="ArrowRight"){ wzGo(MODULES[CUR],1); return; }
      if(e.key==="ArrowLeft"){ wzGo(MODULES[CUR],-1); return; }
    }
  });
}

  const mRaw=new URLSearchParams(location.search).get("m");
  const mParam=mRaw!=null?+mRaw:NaN;
  if(!isNaN(mParam)&&MODULES[mParam]) showModule(mParam);
  else if(prog._last!=null&&MODULES[prog._last]) showModule(prog._last);
  else showDashboard();
}
init();
</script>
